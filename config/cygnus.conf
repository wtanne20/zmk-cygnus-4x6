CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_HIGH=70
CONFIG_RGBLED_WIDGET_BATTERY_LEVEL_CRITICAL=10
CONFIG_RGBLED_WIDGET_CONN_COLOR_ADVERTISING=7
CONFIG_RGBLED_WIDGET_CONN_COLOR_DISCONNECTED=5

CONFIG_RGBLED_WIDGET=y

# Experimental connection/security settings, improves pairing with some Windows hosts
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y

# Max nRF52840 transmit power (+8 dBm) for better range/stability
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y

# Report the right half's battery level to the host too
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_FETCHING=y
CONFIG_ZMK_SPLIT_BLE_CENTRAL_BATTERY_LEVEL_PROXY=y
